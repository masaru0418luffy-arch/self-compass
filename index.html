<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&family=Zen+Kaku+Gothic+New:wght@300;400;500;700;900&display=swap');

  :root{
    --bg:#F2EFE6;
    --surface:#FFFFFF;
    --surface-2:#EAE5D6;
    --ink:#242A21;
    --ink-soft:#5B5D4C;
    --ink-faint:#8B8C78;
    --accent:#3B5344;
    --accent-strong:#28392E;
    --accent-soft:#DCE3D1;
    --accent-ink:#F4F7EF;
    --gold:#A9812F;
    --gold-soft:#F1E3BE;
    --clay:#A15746;
    --clay-soft:#F1DAD1;
    --border:#DBD5C1;
    --shadow:0 1px 2px rgba(36,42,33,0.07), 0 6px 18px rgba(36,42,33,0.07);
    --radius-s:8px;
    --radius-m:14px;
    --radius-l:24px;
    --font-head:'Shippori Mincho', serif;
    --font-body:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#191B15; --surface:#22241C; --surface-2:#2A2C21;
      --ink:#ECE7D8; --ink-soft:#B7B7A0; --ink-faint:#83836C;
      --accent:#8CB093; --accent-strong:#B0CDB4; --accent-soft:#333F30; --accent-ink:#152018;
      --gold:#D9B463; --gold-soft:#3B331D; --clay:#D3907C; --clay-soft:#3A2822;
      --border:#3A3C2F; --shadow:0 1px 2px rgba(0,0,0,0.25), 0 8px 20px rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"]{
    --bg:#191B15; --surface:#22241C; --surface-2:#2A2C21;
    --ink:#ECE7D8; --ink-soft:#B7B7A0; --ink-faint:#83836C;
    --accent:#8CB093; --accent-strong:#B0CDB4; --accent-soft:#333F30; --accent-ink:#152018;
    --gold:#D9B463; --gold-soft:#3B331D; --clay:#D3907C; --clay-soft:#3A2822;
    --border:#3A3C2F; --shadow:0 1px 2px rgba(0,0,0,0.25), 0 8px 20px rgba(0,0,0,0.3);
  }

  *,*::before,*::after{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); line-height:1.7; -webkit-font-smoothing:antialiased; }
  h1,h2,h3{ font-family:var(--font-head); font-weight:700; margin:0 0 .4em; text-wrap:balance; color:var(--ink); }
  p{ margin:0 0 .8em; color:var(--ink-soft); }
  ::selection{ background:var(--accent-soft); }
  a{ color:var(--accent-strong); }
  button{ font-family:inherit; }
  textarea,input{ font-family:inherit; font-size:1rem; color:var(--ink); }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }

  .shell{ max-width:720px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column; }
  .topbar{ position:sticky; top:0; z-index:10; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(8px); border-bottom:1px solid var(--border); padding:.9rem 1.1rem; display:flex; align-items:baseline; justify-content:space-between; gap:.6rem; }
  .topbar .brand{ font-family:var(--font-head); font-size:1.05rem; font-weight:700; letter-spacing:.02em; }
  .topbar .right{ display:flex; align-items:baseline; gap:.7rem; }
  .topbar .streak{ font-size:.78rem; color:var(--ink-faint); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .topbar .logout{ font-size:.74rem; color:var(--ink-faint); background:none; border:none; cursor:pointer; text-decoration:underline; padding:0; }

  main{ flex:1; padding:1.1rem 1.1rem 6.5rem; display:flex; flex-direction:column; gap:1rem; }
  .section-title{ font-size:1.3rem; margin-bottom:.15em; }
  .section-lead{ font-size:.92rem; margin-bottom:.2em; }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); padding:1.1rem 1.2rem; box-shadow:var(--shadow); }
  .card h3{ font-size:1.02rem; margin-bottom:.5em; }

  .row{ display:flex; gap:.6rem; flex-wrap:wrap; align-items:center; }
  .col{ display:flex; flex-direction:column; gap:.5rem; }
  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:.8rem; }
  @media (max-width:420px){ .grid-2{ grid-template-columns:1fr; } }

  .stat{ display:flex; flex-direction:column; gap:.15rem; }
  .stat .num{ font-family:var(--font-head); font-size:1.6rem; font-variant-numeric:tabular-nums; color:var(--accent-strong); line-height:1; }
  .stat .lbl{ font-size:.76rem; color:var(--ink-faint); }

  .progress{ height:8px; border-radius:99px; background:var(--surface-2); overflow:hidden; }
  .progress > div{ height:100%; background:var(--accent); border-radius:99px; transition:width .4s ease; }

  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:.4em; border-radius:999px; border:1px solid transparent; cursor:pointer; padding:.65em 1.2em; font-size:.92rem; font-weight:500; white-space:nowrap; transition:transform .15s ease, opacity .15s ease; }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); }
  .btn-primary:hover{ background:var(--accent-strong); }
  .btn-ghost{ background:transparent; color:var(--accent-strong); border-color:var(--border); }
  .btn-ghost:hover{ background:var(--surface-2); }
  .btn-small{ padding:.4em .9em; font-size:.8rem; }
  .btn[disabled]{ opacity:.5; cursor:default; }
  .btn-block{ width:100%; }

  .chip{ border:1px solid var(--border); background:var(--surface-2); color:var(--ink-soft); border-radius:999px; padding:.35em .85em; font-size:.8rem; cursor:pointer; }
  .chip[aria-pressed="true"]{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent-strong); font-weight:500; }

  textarea, .input{ width:100%; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-s); padding:.7em .8em; resize:vertical; min-height:4.2em; color:var(--ink); }
  input[type="date"].input, input[type="email"].input, input[type="password"].input{ min-height:auto; }
  label.field-label{ font-size:.82rem; color:var(--ink-faint); margin-bottom:.3em; display:block; }
  input[type="range"]{ width:100%; accent-color:var(--accent); }

  details.accordion{ border:1px solid var(--border); border-radius:var(--radius-m); background:var(--surface); overflow:hidden; box-shadow:var(--shadow); }
  details.accordion + details.accordion{ margin-top:.7rem; }
  details.accordion summary{ list-style:none; cursor:pointer; padding:.9rem 1.1rem; display:flex; align-items:center; justify-content:space-between; gap:.6rem; }
  details.accordion summary::-webkit-details-marker{ display:none; }
  details.accordion summary .s-title{ font-family:var(--font-head); font-weight:700; font-size:1rem; }
  details.accordion summary .s-meta{ font-size:.74rem; color:var(--ink-faint); white-space:nowrap; font-variant-numeric:tabular-nums; }
  details.accordion .s-body{ padding:1rem 1.1rem 1.1rem; display:flex; flex-direction:column; gap:1rem; border-top:1px solid var(--border); }
  .q-block .q-label{ font-size:.88rem; color:var(--ink); margin-bottom:.4em; font-weight:500; }

  .entry{ border-bottom:1px solid var(--border); padding:.85rem 0; }
  .entry:last-child{ border-bottom:none; }
  .entry .entry-head{ display:flex; align-items:center; justify-content:space-between; gap:.6rem; margin-bottom:.3rem; }
  .entry .entry-date{ font-size:.78rem; color:var(--ink-faint); font-variant-numeric:tabular-nums; }
  .entry .entry-scores{ font-size:.78rem; color:var(--accent-strong); font-variant-numeric:tabular-nums; }
  .entry .entry-tags{ display:flex; gap:.35rem; flex-wrap:wrap; margin:.35rem 0; }
  .entry .tag-pill{ font-size:.7rem; background:var(--accent-soft); color:var(--accent-strong); padding:.15em .6em; border-radius:999px; }
  .entry .entry-note{ font-size:.88rem; color:var(--ink); white-space:pre-wrap; }
  .entry .insight-tag{ font-size:.7rem; color:var(--gold); font-weight:700; }

  .empty{ text-align:center; padding:2rem 1rem; color:var(--ink-faint); font-size:.88rem; }

  .action-row{ display:flex; align-items:center; gap:.7rem; padding:.7rem 0; border-bottom:1px solid var(--border); }
  .action-row:last-child{ border-bottom:none; }
  .action-row .a-title{ flex:1; font-size:.92rem; }
  .action-row.done .a-title{ text-decoration:line-through; color:var(--ink-faint); }
  select.status-select{ background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:.3em .7em; font-size:.76rem; color:var(--ink); }
  .icon-btn{ background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:1rem; padding:.2em .4em; }
  .icon-btn:hover{ color:var(--clay); }

  .cat-dot{ display:inline-block; width:.62em; height:.62em; border-radius:50%; margin-right:.4em; vertical-align:middle; flex-shrink:0; }
  .color-chip{ width:1.9em; height:1.9em; padding:0; border-radius:50%; border-width:2px; }
  .color-chip[aria-pressed="true"]{ box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--ink); }
  .change-pill{ font-size:.78rem; padding:.32em .8em; border-radius:999px; font-variant-numeric:tabular-nums; font-weight:500; white-space:nowrap; }
  .change-pill.up{ background:var(--accent-soft); color:var(--accent-strong); }
  .change-pill.down{ background:var(--clay-soft); color:var(--clay); }
  .change-pill.flat{ background:var(--surface-2); color:var(--ink-faint); }
  .range-label{ font-size:.78rem; color:var(--ink-faint); }
  .range-total{ font-size:1.05rem; font-weight:600; font-variant-numeric:tabular-nums; }

  nav.bottombar{ position:fixed; left:0; right:0; bottom:0; z-index:20; display:flex; justify-content:center; }
  nav.bottombar .inner{ max-width:720px; width:100%; display:flex; background:color-mix(in srgb, var(--surface) 96%, transparent); backdrop-filter:blur(10px); border-top:1px solid var(--border); padding:.4rem .4rem calc(.4rem + env(safe-area-inset-bottom)); }
  nav.bottombar button{ flex:1; background:none; border:none; cursor:pointer; padding:.45rem .2rem; display:flex; flex-direction:column; align-items:center; gap:.22rem; color:var(--ink-faint); font-size:.68rem; }
  nav.bottombar button svg{ width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.7; }
  nav.bottombar button[aria-current="true"]{ color:var(--accent-strong); }
  nav.bottombar button[aria-current="true"] svg{ stroke-width:2; }

  .banner{ font-size:.8rem; padding:.7em 1em; border-radius:var(--radius-s); background:var(--clay-soft); color:var(--clay); border:1px solid var(--clay); }
  .banner.ok{ background:var(--accent-soft); color:var(--accent-strong); border-color:var(--accent); }

  .chat-log{ display:flex; flex-direction:column; gap:.6rem; max-height:26rem; overflow-y:auto; }
  .chat-msg{ display:flex; }
  .chat-msg.chat-user{ justify-content:flex-end; }
  .chat-msg.chat-assistant{ justify-content:flex-start; }
  .chat-bubble{ max-width:82%; padding:.65em .9em; border-radius:var(--radius-m); font-size:.9rem; white-space:pre-wrap; line-height:1.6; }
  .chat-user .chat-bubble{ background:var(--accent); color:var(--accent-ink); border-bottom-right-radius:4px; }
  .chat-assistant .chat-bubble{ background:var(--surface-2); color:var(--ink); border-bottom-left-radius:4px; }

    var w = Math.max(300, buckets.length*perBar);
    var h=120, padB=16, padT=10;
    var bw = w/buckets.length;
    var avgY = h-padB-(max>0 ? (avgVal/max)*(h-padB-padT) : 0);
    var showLabelEvery = period==="1M" ? 7 : 1;
    var bars = buckets.map(function(b,i){
      var val=values[i]; var bh = val>0 ? Math.max(3,(val/max)*(h-padB-padT)) : 0;
      var x=i*bw+bw*0.18, bw2=bw*0.64, y=h-padB-bh;
      var label = (i%showLabelEvery===0) ? '<text x="'+(x+bw2/2).toFixed(1)+'" y="'+(h-3)+'" font-size="8" fill="var(--ink-faint)" text-anchor="middle">'+esc(b.label)+'</text>' : "";
      return '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw2.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="2" fill="var(--accent)"><title>'+esc(b.label)+" "+minToHM(val)+'</title></rect>' + label;
    }).join("");
    return '<div class="chart-wrap"><svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="xMinYMid meet">' +
      '<line x1="0" y1="'+avgY.toFixed(1)+'" x2="'+w+'" y2="'+avgY.toFixed(1)+'" stroke="var(--gold)" stroke-width="1" stroke-dasharray="4 3"/>' +
      '<text x="'+w+'" y="'+(avgY-3).toFixed(1)+'" font-size="8" fill="var(--gold)" text-anchor="end">平均</text>' +
      bars + '</svg></div>';
  }
  function donutChart(catAgg, total){
    var cx=54, cy=54, r=42, circ=2*Math.PI*r, offset=0;
    if(total<=0) return '<svg viewBox="0 0 108 108" width="108" height="108"><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--surface-2)" stroke-width="13"/></svg>';
    var segs = catAgg.map(function(c){
      var frac = c.minutes/total, dash = frac*circ;
      var seg = '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+colorHex(c.color)+'" stroke-width="13" stroke-dasharray="'+dash.toFixed(1)+' '+(circ-dash).toFixed(1)+'" stroke-dashoffset="'+(-offset).toFixed(1)+'" transform="rotate(-90 '+cx+' '+cy+')"><title>'+esc(c.name)+" "+Math.round(frac*100)+"%"+'</title></circle>';
      offset += dash;
      return seg;
    }).join("");
    return '<svg viewBox="0 0 108 108" width="108" height="108">'+segs+'</svg>';
  }

  /* ---------- persistence (Firestore) ---------- */
  function docRef(){ return db.collection("users").doc(currentUser.uid); }

  function persist(mutator){
    var next = JSON.parse(JSON.stringify(state));
    mutator(next);
    next.meta.updatedAt = new Date().toISOString();
    state = next;
    sessionStorage.setItem("sc_tab", tab);
    render();
    docRef().set(next).catch(function(err){
      console.error(err);
      render(true);
    });
  }

  function attachListener(){
    if(unsubSnapshot) unsubSnapshot();
    unsubSnapshot = docRef().onSnapshot(function(snap){
      if(snap.exists){
        var data = snap.data();
        state = Object.assign({}, DEFAULT_STATE, data, {
          intake: data.intake || {}, journal: data.journal || [], insights: data.insights || [], actions: data.actions || [], goals: data.goals || [], chatHistory: data.chatHistory || [],
          categories: data.categories || [], timeSessions: data.timeSessions || [], schedule: data.schedule || [], timer: data.timer || { categoryId:null, startedAt:null, durationMin:null }
        });
      } else {
        docRef().set(state);
      }
      render();
    }, function(err){ console.error(err); render(true); });
  }

  /* ---------- render helpers ---------- */
  function sparkline(entries, unitLabel){
    unitLabel = unitLabel || "気分";
    if(!entries.length) return '<p style="font-size:.82rem">まだ記録がありません。</p>';
    var w=300,h=64,pad=4,n=entries.length,bw=(w-pad*2)/n;
    var bars = entries.map(function(e,i){
      var bh = Math.max(3,(e.mood/10)*(h-pad*2)); var x=pad+i*bw; var y=h-pad-bh;
      return '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+Math.max(2,bw-2).toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="2" fill="var(--accent)" opacity="'+(0.45+0.55*(i/n)).toFixed(2)+'"><title>'+esc(e.date)+" "+unitLabel+e.mood+'</title></rect>';
    }).join("");
    return '<div class="chart-wrap"><svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none"><line x1="'+pad+'" y1="'+(h-pad)+'" x2="'+(w-pad)+'" y2="'+(h-pad)+'" stroke="var(--border)" stroke-width="1"/>'+bars+'</svg></div>';
  }
  function goalLatestScore(g){
    if(!g.checkins || !g.checkins.length) return null;
    var sorted = g.checkins.slice().sort(function(a,b){ return a.date < b.date ? 1 : -1; });
    return sorted[0].score;
  }

    return options.map(function(o){ var on = selected.indexOf(o) > -1; return '<button type="button" class="chip" data-chip="'+name+'" data-val="'+esc(o)+'" aria-pressed="'+on+'">'+esc(o)+'</button>'; }).join("");

  function buildSummary(){
    var lines = [];
    lines.push("あなたは資格を持つ一流のキャリア・メンタルカウンセラーです。以下はマサルさんについて、これまでに蓄積されたプロフィールと最近の記録です。");
    lines.push("この情報をもとに、(1)今のマサルさんの状況と傾向の分析 (2)気をつけたほうがよいパターン (3)次の一歩の具体的な提案 を、共感的かつ実践的に伝えてください。");
    lines.push("");
    lines.push("【自己分析プロフィール】");
    var any = false;
    INTAKE_SECTIONS.forEach(function(sec){
      var a = state.intake[sec.id] || {};
      var qs = sec.questions.filter(function(q){ return a[q.id] && a[q.id].trim(); });
      if(!qs.length) return;
      any = true;
      lines.push("■"+sec.title);
      qs.forEach(function(q){ lines.push("Q. "+q.label); lines.push("A. "+a[q.id].trim()); });
      lines.push("");
    });
    if(!any) lines.push("（まだ自己分析の回答がありません）");
    lines.push("【直近30日の記録】");
    var rj = recentJournal(30).slice().sort(function(a,b){ return a.date < b.date ? -1 : 1; });
    if(rj.length){ rj.forEach(function(j){ lines.push(j.date+" 気分:"+j.mood+"/10 エネルギー:"+j.energy+"/10"+(j.tags&&j.tags.length?" タグ:"+j.tags.join(","):"")); if(j.note) lines.push("  メモ: "+j.note); }); }
    else lines.push("（記録なし）");
    lines.push("");
    lines.push("【気づきログ（最近20件）】");
    var ri = state.insights.slice().sort(function(a,b){ return a.date < b.date ? 1 : -1; }).slice(0,20);
    if(ri.length){ ri.forEach(function(i){ lines.push(i.date+(i.tag?" ["+i.tag+"]":"")+" "+i.text); }); } else lines.push("（記録なし）");
    lines.push("");
    lines.push("【現在のアクション】");
    if(state.actions.length){ var labelMap={todo:"未着手",doing:"進行中",done:"完了"}; state.actions.forEach(function(a){ lines.push("- ["+labelMap[a.status]+"] "+a.title); }); } else lines.push("（登録なし）");
    lines.push("");
    lines.push("【目標と進捗】");
    if(state.goals && state.goals.length){
      state.goals.forEach(function(g){
        var latest = goalLatestScore(g);
        lines.push("・"+g.title+(g.status==="done"?"（達成済み）":"")+(g.targetDate?"　期限:"+g.targetDate:""));
        if(g.definition) lines.push("  成功の定義: "+g.definition);
        lines.push("  最新の達成度: "+(latest!==null ? latest+"/10" : "未記録")+(g.checkins&&g.checkins.length>1 ? "（記録"+g.checkins.length+"回・推移あり）" : ""));
      });
    } else lines.push("（登録なし）");
    lines.push("");
    lines.push("【努力量トラッキング（直近30日・カテゴリ別の合計時間）】");
    var cutoff = fmtISO(new Date(Date.now()-30*86400000));
    var recentSessions = (state.timeSessions||[]).filter(function(s){ return s.date >= cutoff; });
    if(recentSessions.length){
      var agg = {};
      recentSessions.forEach(function(s){ agg[s.categoryId] = (agg[s.categoryId]||0) + s.durationMin; });
      Object.keys(agg).sort(function(a,b){ return agg[b]-agg[a]; }).forEach(function(k){
        var c = catById(k);
        lines.push("・"+(c?c.name:"削除済みカテゴリ")+"："+minToHM(agg[k]));
      });
      lines.push("記録のストリーク（連続日数）："+timeStreak()+"日");
    } else lines.push("（記録なし）");
    return lines.join("\n");
  }

  function sendChatMessage(text){
    var history = (state.chatHistory||[]).map(function(m){ return { role:m.role, content:m.content }; });
    var messages = history.concat([{ role:"user", content:text }]);
    persist(function(next){ next.chatHistory = (next.chatHistory||[]).concat([{ role:"user", content:text, ts:new Date().toISOString() }]); });
    chatPending = true; chatError = ""; render();
    fetch(WORKER_URL, {
      method:"POST",
      headers:{ "content-type":"application/json" },
      body: JSON.stringify({ system: buildCounselorSystem(), messages: messages })
    }).then(function(r){
      return r.json().then(function(data){ return { ok:r.ok, data:data }; });
    }).then(function(res){
      chatPending = false;
      if(!res.ok || !res.data || res.data.error || !res.data.text){
        chatError = "応答の取得に失敗しました。しばらくしてからもう一度お試しください。";
        render();
        return;
      }
      persist(function(next){ next.chatHistory = (next.chatHistory||[]).concat([{ role:"assistant", content:res.data.text, ts:new Date().toISOString() }]); });
    }).catch(function(err){
      console.error(err);
      chatPending = false;
      chatError = "通信エラーが発生しました。ネットワークをご確認のうえ、もう一度お試しください。";
      render();
    });
  }

  function wireEvents(app){

    app.querySelectorAll("[data-tab]").forEach(function(b){ b.addEventListener("click", function(){ tab=b.getAttribute("data-tab"); sessionStorage.setItem("sc_tab",tab); render(); }); });
    app.querySelectorAll("[data-nav]").forEach(function(b){ b.addEventListener("click", function(){ tab=b.getAttribute("data-nav"); sessionStorage.setItem("sc_tab",tab); render(); }); });
    app.querySelectorAll("details.accordion").forEach(function(d){ d.addEventListener("toggle", function(){ sessionStorage.setItem("sc_open_"+d.getAttribute("data-sec"), d.open?"1":"0"); }); });
    app.querySelectorAll("[data-save-intake]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var secId = btn.getAttribute("data-save-intake"); var vals = {};
        app.querySelectorAll('[data-intake-sec="'+secId+'"]').forEach(function(ta){ vals[ta.getAttribute("data-intake-q")] = ta.value; });
        persist(function(next){ next.intake[secId] = Object.assign({}, next.intake[secId]||{}, vals); });
      });
    });
    var moodEl=app.querySelector("#j-mood"), moodVal=app.querySelector("#j-mood-val");
    var energyEl=app.querySelector("#j-energy"), energyVal=app.querySelector("#j-energy-val");
    if(moodEl) moodEl.addEventListener("input", function(){ moodVal.textContent = moodEl.value; });
    if(energyEl) energyEl.addEventListener("input", function(){ energyVal.textContent = energyEl.value; });
    var jTags = [];
    app.querySelectorAll('[data-chip="j"]').forEach(function(chip){
      chip.addEventListener("click", function(){
        var v = chip.getAttribute("data-val"); var i = jTags.indexOf(v);
        if(i>-1){ jTags.splice(i,1); chip.setAttribute("aria-pressed","false"); } else { jTags.push(v); chip.setAttribute("aria-pressed","true"); }
      });
    });
    var jSubmit = app.querySelector("#j-submit");
    if(jSubmit) jSubmit.addEventListener("click", function(){
      var date = app.querySelector("#j-date").value || todayStr();
      var mood = parseInt(app.querySelector("#j-mood").value,10);
      var energy = parseInt(app.querySelector("#j-energy").value,10);
      var note = app.querySelector("#j-note").value.trim();
      persist(function(next){ next.journal = next.journal.filter(function(j){ return j.date !== date; }); next.journal.push({ id:uid(), date:date, mood:mood, energy:energy, note:note, tags:jTags.slice() }); });
    });
    var iSubmit = app.querySelector("#i-submit");
    if(iSubmit) iSubmit.addEventListener("click", function(){
      var text = app.querySelector("#i-text").value.trim(); if(!text) return;
      var t = app.querySelector("#i-tag").value.trim();
      persist(function(next){ next.insights.unshift({ id:uid(), date:todayStr(), text:text, tag:t }); });
    });
    var aSubmit = app.querySelector("#a-submit");
    if(aSubmit) aSubmit.addEventListener("click", function(){
      var titleEl = app.querySelector("#a-title"); var title = titleEl.value.trim(); if(!title) return;
      persist(function(next){ next.actions.unshift({ id:uid(), title:title, status:"todo", createdAt:todayStr() }); });
    });
    app.querySelectorAll("[data-action-status]").forEach(function(sel){
      sel.addEventListener("change", function(){ var id=sel.getAttribute("data-action-status"); var v=sel.value; persist(function(next){ next.actions.forEach(function(a){ if(a.id===id) a.status=v; }); }); });
    });
    app.querySelectorAll("[data-action-del]").forEach(function(btn){
      btn.addEventListener("click", function(){ var id=btn.getAttribute("data-action-del"); persist(function(next){ next.actions = next.actions.filter(function(a){ return a.id!==id; }); }); });
    });
    var gSubmit = app.querySelector("#g-submit");
    if(gSubmit) gSubmit.addEventListener("click", function(){
      var title = app.querySelector("#g-title").value.trim(); if(!title) return;
      var def = app.querySelector("#g-def").value.trim();
      var date = app.querySelector("#g-date").value;
      persist(function(next){ next.goals = next.goals || []; next.goals.unshift({ id:uid(), title:title, definition:def, targetDate:date, createdAt:todayStr(), status:"active", checkins:[] }); });
    });
    app.querySelectorAll("[data-goal-score]").forEach(function(rng){
      rng.addEventListener("input", function(){
        var id = rng.getAttribute("data-goal-score");
        var out = app.querySelector('[data-goal-score-val="'+id+'"]');
        if(out) out.textContent = rng.value;
      });
    });
    app.querySelectorAll("[data-goal-checkin]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-goal-checkin");
        var rng = app.querySelector('[data-goal-score="'+id+'"]');
        var score = parseInt(rng.value,10);
        var date = todayStr();
        persist(function(next){
          next.goals.forEach(function(g){
            if(g.id===id){
              g.checkins = (g.checkins||[]).filter(function(c){ return c.date !== date; });
              g.checkins.push({ date:date, score:score });
            }
          });
        });
      });
    });
    app.querySelectorAll("[data-goal-status]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-goal-status"); var nextStatus = btn.getAttribute("data-next");
        persist(function(next){ next.goals.forEach(function(g){ if(g.id===id) g.status = nextStatus; }); });
      });
    });
    app.querySelectorAll("[data-goal-del]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-goal-del");
        persist(function(next){ next.goals = next.goals.filter(function(g){ return g.id!==id; }); });
      });
    });
    var chatSend = app.querySelector("#chat-send");
    var chatInput = app.querySelector("#chat-input");
    function doSendChat(){
      if(chatPending) return;
      var text = chatInput.value.trim(); if(!text) return;
      chatInput.value = "";
      sendChatMessage(text);
    }
    if(chatSend) chatSend.addEventListener("dblclick", doSendChat);
    if(chatInput) chatInput.addEventListener("keydown", function(e){
      if(e.key === "Enter" && !e.shiftKey){
        if(e.isComposing || e.keyCode === 229) return;
        e.preventDefault();
        var now = Date.now();
        if(chatEnterArmedAt && (now - chatEnterArmedAt) < 800){
          chatEnterArmedAt = 0;
          doSendChat();
        } else {
          chatEnterArmedAt = now;
        }
      } else if(e.key !== "Shift") {
        chatEnterArmedAt = 0;
      }
    });
    scrollChatToBottom(app);

    /* ---------- effort tracking events ---------- */
    app.querySelectorAll("[data-goals-sub]").forEach(function(b){
      b.addEventListener("click", function(){ goalsSubTab = b.getAttribute("data-goals-sub"); sessionStorage.setItem("sc_goals_sub", goalsSubTab); render(); });
    });
    app.querySelectorAll("[data-period]").forEach(function(b){
      b.addEventListener("click", function(){ analyticsPeriod = b.getAttribute("data-period"); sessionStorage.setItem("sc_ap", analyticsPeriod); render(); });
    });
    app.querySelectorAll(".color-chip").forEach(function(chip){
      chip.addEventListener("click", function(){
        app.querySelectorAll(".color-chip").forEach(function(c2){ c2.setAttribute("aria-pressed","false"); });
        chip.setAttribute("aria-pressed","true");
      });
    });
    var cSubmit = app.querySelector("#c-submit");
    if(cSubmit) cSubmit.addEventListener("click", function(){
      var nameEl = app.querySelector("#c-name"); var name = nameEl.value.trim(); if(!name) return;
      var colorChip = app.querySelector('.color-chip[aria-pressed="true"]');
      var color = colorChip ? colorChip.getAttribute("data-color") : CATEGORY_COLORS[0].id;
      persist(function(next){ next.categories = (next.categories||[]).concat([{ id:uid(), name:name, color:color, createdAt:new Date().toISOString() }]); });
    });
    app.querySelectorAll("[data-cat-del]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-cat-del");
        persist(function(next){ next.categories = (next.categories||[]).filter(function(c){ return c.id!==id; }); });
      });
    });
    var timerH = app.querySelector("#timer-h"), timerM = app.querySelector("#timer-m"), timerCatSel = app.querySelector("#timer-cat");
    if(timerH) timerH.addEventListener("change", function(){ sessionPickerHours = parseInt(timerH.value,10)||0; });
    if(timerM) timerM.addEventListener("change", function(){ sessionPickerMinutes = parseInt(timerM.value,10)||0; });
    if(timerCatSel) timerCatSel.addEventListener("change", function(){ sessionPickerCategoryId = timerCatSel.value; });
    var timerStart = app.querySelector("#timer-start");
    if(timerStart) timerStart.addEventListener("click", function(){
      var h = parseInt(app.querySelector("#timer-h").value,10)||0;
      var m = parseInt(app.querySelector("#timer-m").value,10)||0;
      var dur = h*60+m;
      var catSel = app.querySelector("#timer-cat");
      if(!catSel || !catSel.value || dur<=0) return;
      sessionPickerHours = h; sessionPickerMinutes = m; sessionPickerCategoryId = catSel.value;
      ensureAudioCtx();
      persist(function(next){ next.timer = { categoryId:catSel.value, startedAt:new Date().toISOString(), durationMin:dur }; });
    });
    app.querySelectorAll("[data-sched-start]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-sched-start");
        var s = (state.schedule||[]).filter(function(x){ return x.id===id; })[0];
        if(!s) return;
        var dur = Math.max(5, s.endMin - s.startMin);
        sessionPickerHours = Math.floor(dur/60);
        sessionPickerMinutes = dur%60;
        sessionPickerCategoryId = s.categoryId;
        render();
        var card = document.getElementById("timer-picker-card");
        if(card) card.scrollIntoView({ behavior:"smooth", block:"start" });
      });
    });
    var timerFinish = app.querySelector("#timer-finish");
    if(timerFinish) timerFinish.addEventListener("click", function(){
      stopAlarm();
      persist(function(next){
        var t = next.timer || {};
        if(t.startedAt && t.durationMin){
          var elapsedSec = Math.floor((Date.now() - new Date(t.startedAt).getTime())/1000);
          var plannedSec = t.durationMin*60;
          var mins = elapsedSec >= plannedSec ? t.durationMin : Math.max(1, Math.round(elapsedSec/60));
          next.timeSessions = (next.timeSessions||[]).concat([{ id:uid(), categoryId:t.categoryId, date:todayStr(), durationMin:mins, source:"timer", createdAt:new Date().toISOString() }]);
        }
        next.timer = { categoryId:null, startedAt:null, durationMin:null };
      });
    });
    var timerDiscard = app.querySelector("#timer-discard");
    if(timerDiscard) timerDiscard.addEventListener("click", function(){
      stopAlarm();
      persist(function(next){ next.timer = { categoryId:null, startedAt:null, durationMin:null }; });
    });
    var mSubmit = app.querySelector("#m-submit");
    if(mSubmit) mSubmit.addEventListener("click", function(){
      var catSel = app.querySelector("#m-cat"); if(!catSel || !catSel.value) return;
      var date = app.querySelector("#m-date").value || todayStr();
      var min = parseInt(app.querySelector("#m-min").value, 10);
      if(!min || min<1) return;
      persist(function(next){ next.timeSessions = (next.timeSessions||[]).concat([{ id:uid(), categoryId:catSel.value, date:date, durationMin:min, source:"manual", createdAt:new Date().toISOString() }]); });
    });
    app.querySelectorAll("[data-session-del]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-session-del");
        persist(function(next){ next.timeSessions = (next.timeSessions||[]).filter(function(s){ return s.id!==id; }); });
      });
    });
    var sSubmit = app.querySelector("#s-submit");
    if(sSubmit) sSubmit.addEventListener("click", function(){
      var startEl = app.querySelector("#s-start"), endEl = app.querySelector("#s-end"), catEl = app.querySelector("#s-cat"), titleEl = app.querySelector("#s-title");
      if(!startEl.value || !endEl.value || !catEl.value) return;
      var sm = timeStrToMin(startEl.value), em = timeStrToMin(endEl.value);
      if(em<=sm) return;
      persist(function(next){ next.schedule = (next.schedule||[]).concat([{ id:uid(), date:todayStr(), categoryId:catEl.value, startMin:sm, endMin:em, title:titleEl.value.trim(), done:false }]); });
    });
    app.querySelectorAll("[data-sched-done]").forEach(function(cb){
      cb.addEventListener("change", function(){
        var id = cb.getAttribute("data-sched-done");
        persist(function(next){ (next.schedule||[]).forEach(function(s){ if(s.id===id) s.done = cb.checked; }); });
      });
    });
    app.querySelectorAll("[data-sched-del]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-sched-del");
        persist(function(next){ next.schedule = (next.schedule||[]).filter(function(s){ return s.id!==id; }); });
      });
    });

    if(timerTickInterval){ clearInterval(timerTickInterval); timerTickInterval = null; }
    if(state.timer && state.timer.categoryId && tab==="goals" && goalsSubTab==="today"){
      timerTickInterval = setInterval(function(){
        var el = document.getElementById("timer-countdown");
        if(!el){ clearInterval(timerTickInterval); timerTickInterval = null; return; }
        var dur = parseFloat(el.getAttribute("data-duration"));
        var started = el.getAttribute("data-started");
        var r = remainingSec(started, dur);
        var ringing = r <= 0;
        if(r<0) r=0;
        var m=Math.floor(r/60), s=r%60;
        el.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
        var btn = document.getElementById("timer-finish");
        if(btn){
          if(ringing){ btn.textContent="完了"; btn.classList.remove("btn-ghost"); btn.classList.add("btn-primary"); }
          else { btn.textContent="セッションを終了"; btn.classList.remove("btn-primary"); btn.classList.add("btn-ghost"); }
        }
      }, 1000);
    }
  }

  function boot(){
    if(!CONFIG_READY){
      document.getElementById("app").innerHTML = '<div class="loading-wrap" style="flex-direction:column;gap:.8rem;padding:2rem;text-align:center">' +
        '<p style="max-width:26rem">Firebaseの設定がまだ入っていません。Claudeとの会話でFirebaseプロジェクトの設定値を伝えて、このファイルを完成させてもらってください。</p></div>';
      return;
    }
    firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    db = firebase.firestore();
    auth.onAuthStateChanged(function(user){
      currentUser = user;
      if(user){ attachListener(); } else { if(unsubSnapshot){ unsubSnapshot(); unsubSnapshot=null; } state = JSON.parse(JSON.stringify(DEFAULT_STATE)); render(); }
    });
  }

  boot();
  setInterval(alarmTick, 1000);
})();
</script>
</body>
</html>
